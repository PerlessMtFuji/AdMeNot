[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "admenot"
dynamic = ["version"]
description = "Heurystyczne wykrywanie intruzywnych aplikacji Android przez ADB"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0", "androguard>=4.1,<5", "jinja2>=3.1", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gui = ["pywebview>=6.2"]
release = ["pyinstaller>=6.22", "pywebview>=6.2"]

[project.scripts]
admenot = "admenot.cli.main:main"
admenot-gui = "admenot.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/admenot"]

[tool.hatch.version]
path = "src/admenot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Czasy są lokalnym zegarem telefonu (`date`) i porównywane tylko ze sobą — celowo bez strefy.
ignore = ["DTZ"]
