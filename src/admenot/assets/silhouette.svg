<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 156 272" width="156" height="272">
  <title>Telefon</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4558"/>
      <stop offset=".55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#475569" stop-opacity=".5"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".5" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".2" cy=".22" r=".6">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".78" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="9" y="9" width="102" height="222" rx="13"/></clipPath>
  </defs>
  <!-- przyciski boczne -->
  <rect x="117" y="58" width="4" height="22" rx="1.5" fill="#334155"/>
  <rect x="117" y="90" width="4" height="40" rx="1.5" fill="#334155"/>
  <!-- obudowa -->
  <rect x="2" y="2" width="116" height="236" rx="19" fill="url(#body)"/>
  <rect x="2.75" y="2.75" width="114.5" height="234.5" rx="18.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- ekran -->
  <g clip-path="url(#clip)">
    <rect x="9" y="9" width="102" height="222" fill="url(#screen)"/>
    <rect x="9" y="9" width="102" height="222" fill="url(#glowA)"/>
    <rect x="9" y="9" width="102" height="222" fill="url(#glowB)"/>
    <path d="M9 9h62L9 150z" fill="url(#glare)"/>
  </g>
  <rect x="9.5" y="9.5" width="101" height="221" rx="12.5" fill="none" stroke="#000" stroke-opacity=".35"/>
  <!-- aparat przedni i pasek gestów -->
  <circle cx="60" cy="20" r="3.4" fill="#0b1020"/>
  <circle cx="61" cy="19" r="1" fill="#475569"/>
  <rect x="44" y="222" width="32" height="2.6" rx="1.3" fill="#fff" fill-opacity=".55"/>
</svg>
