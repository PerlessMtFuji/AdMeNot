# Potwierdzone wskaźniki zagrożeń (IOC) — jedyne źródło werdyktu „potwierdzone” (basis: confirmed).
# Każdy wpis MUSI mieć:
#   kind:   sha256 (skrót pliku APK) | signer (SHA-256 certyfikatu podpisującego)
#   value:  64 znaki hex, małe litery
#   family: nazwa rodziny/kampanii z raportu źródłowego
#   source: https://… — publiczny raport lub wpis w bazie próbek potwierdzający klasyfikację
#   added:  data dodania (RRRR-MM-DD)
# Kryteria wpisu (plan 2026-10-01, Task 14):
#   - raport publiczny https:// wskazujący próbkę albo certyfikat; bez źródła wpisu nie ma;
#   - sha256 całego pliku APK wzięty z raportu, nie przeliczony z innej kompilacji;
#   - exclusive: true (tylko signer) wyłącznie wtedy, gdy raport wprost stwierdza, że certyfikat
#     podpisuje tylko szkodliwe aplikacje — bez tego trafienie samego podpisującego jest słabsze
#     (DM-IOC-02, waga 30, bez pewności „potwierdzone”), bo podpisujący bywa wspólny;
#   - data dodania; każdy wpis osobnym commitem z testem, że plik się wczytuje.
# Nazwy pakietów nie są wskaźnikami: da się je podrobić i zdarzają się kolizje z legalnymi aplikacjami.
# Każda zmiana wpisów podnosi `version`. Wpisów nie tworzy się z domysłów ani z wyników tego programu.
