# Lista chroniona (spec §7.3): akcje zablokowane. Tryb ekspercki odblokowuje pakiet
# po wpisaniu jego nazwy (`--unlock PAKIET`). Wpis kończący się na ".*" to prefiks.
# Dochodzą do niej dynamicznie launchery systemowe (planner.py). Aktywna klawiatura
# ma osobną blokadę: da się ją wyciszyć, ale nie wyłączyć ani usunąć.
protected:
  - android
  - com.android.systemui
  - com.android.settings
  - com.android.phone
  - com.android.server.telecom
  - com.android.dialer
  - com.google.android.dialer
  - com.samsung.android.dialer
  - com.android.packageinstaller
  - com.google.android.packageinstaller
  - com.android.permissioncontroller
  - com.google.android.permissioncontroller
  - com.android.shell
  - com.android.providers.*
  - com.android.bluetooth
  - com.android.nfc
  - com.google.android.gms
  - com.google.android.gsf
  - com.android.vending
